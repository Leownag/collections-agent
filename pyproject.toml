[project]
name = "collections-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai-slim[openai,logfire]==2.68.0",
    "pydantic-evals==2.68.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["mypy>=2.4", "pytest>=9.2"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
